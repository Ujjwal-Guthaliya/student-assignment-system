<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Assignment - StudyFlow</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="dark-mode">

<div class="main" style="margin-left: 0; width: 100%;">

    <div class="topbar">

        <div>
            <span class="page-label">ASSIGNMENTS</span>
            <h1>Edit Assignment</h1>
        </div>

        <div class="top-user">
            <span>StudyFlow</span>
        </div>

    </div>


    <div class="add-section">

        <div class="section-heading">

            <span class="section-label">
                UPDATE DETAILS
            </span>

            <h2>Edit your assignment</h2>

            <p>
                Update the assignment information below and save your changes.
            </p>

        </div>


        <form method="POST" class="assignment-form">

            <!-- Assignment Title -->
            <div class="input-group">

                <label for="title">
                    Assignment Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ assignment['title'] }}"
                    placeholder="Enter assignment title"
                    required
                >

            </div>


            <!-- Subject -->
            <div class="input-group">

                <label for="subject">
                    Subject
                </label>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    value="{{ assignment['subject'] }}"
                    placeholder="Enter subject"
                    required
                >

            </div>


            <!-- Description -->
            <div class="input-group full">

                <label for="description">
                    Description
                </label>

                <input
                    type="text"
                    id="description"
                    name="description"
                    value="{{ assignment['description'] or '' }}"
                    placeholder="Enter assignment description"
                >

            </div>


            <!-- Deadline -->
            <div class="input-group">

                <label for="deadline">
                    Deadline
                </label>

                <input
                    type="date"
                    id="deadline"
                    name="deadline"
                    value="{{ assignment['deadline'] }}"
                    required
                >

            </div>


            <!-- Priority -->
            <div class="input-group">

                <label for="priority">
                    Priority
                </label>

                <select id="priority" name="priority">

                    <option value="Low"
                        {% if assignment['priority'] == 'Low' %}selected{% endif %}>
                        Low Priority
                    </option>

                    <option value="Medium"
                        {% if assignment['priority'] == 'Medium' %}selected{% endif %}>
                        Medium Priority
                    </option>

                    <option value="High"
                        {% if assignment['priority'] == 'High' %}selected{% endif %}>
                        High Priority
                    </option>

                </select>

            </div>


            <!-- Buttons -->
            <div class="form-actions">

                <a href="/"
                   class="clear-button"
                   style="margin-right: 10px;">
                    ← Back to Dashboard
                </a>

                <button type="submit"
                        class="submit-button">
                    Update Assignment
                </button>

            </div>

        </form>

    </div>


    <footer>

        <span>StudyFlow</span>

        <span>Stay organized. Stay ahead.</span>

    </footer>

</div>

</body>

</html>
