<!DOCTYPE html>
<html>

<head>

    <title>Login - Student Assignment Manager</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <div class="form-box">

        <h1>Student Login</h1>

        <p>Login to manage your assignments</p>

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="/register">Create Account</a>
        </p>

    </div>

</div>

</body>
</html>
